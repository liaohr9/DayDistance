name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core policy and storage tests
        run: swift test
      - name: CLI protocol, ownership, durable retries and MCP
        run: python3 script/test_automation.py
      - name: Selected Xcode portability
        run: python3 script/test_automation_portability.py
      - name: Bounded event undo and updater framework recovery
        run: |
          python3 script/test_undo.py
          python3 script/test_prepare_sparkle.py
          python3 script/test_update_package.py
      - name: Safe application replacement
        run: python3 script/test_install.py
      - name: Background registration lifecycle
        run: zsh script/test_background_reminders.sh
      - name: Notification service and coverage presentation
        run: zsh Tests/Fixtures/Reminders/test.sh
      - name: Settings routing and modal guards
        run: python3 script/test_settings.py
      - name: Batch lifecycle and expiration
        run: zsh script/test_batch.sh
      - name: Lists, hierarchy and membership storage
        run: python3 script/test_smart_list_store.py
      - name: Widget sources and date-based selection
        run: |
          python3 script/test_widget_intent.py
          python3 script/test_widget_smart_lists.py
      - name: Release catalog and update descriptions
        run: python3 script/test_release_notes.py
      - name: Widget registration lifecycle
        run: python3 script/test_widget_maintenance.py
      - name: Update settings and editing protection
        run: python3 script/test_updates.py
